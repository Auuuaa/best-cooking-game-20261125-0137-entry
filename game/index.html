<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Station — a lightning-fast kitchen rush</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #241a12;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap {
    width: 1280px;
    max-width: 100vw;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: auto;
    cursor: pointer;
    background: #c98f5f;
  }
  #foot {
    color: #cbb89a;
    font-size: 12px;
    text-align: center;
    padding: 6px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="foot">Sizzle Station — move with WASD or arrows, press E to use a station, click a station to walk over. No network needed.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
